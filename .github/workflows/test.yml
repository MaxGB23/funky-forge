name: tests

# Tests only. Publishing stays a manual, deliberate decision.
#
# Pinning policy, deliberately mixed: pin what must not change, float what must
# receive security fixes.
#   - Runner images: exact labels, never `-latest`. An image keeps receiving OS
#     patches in place, so the exact label only opts out of major migrations
#     (for example `ubuntu-latest` moving to 26.04), which would otherwise turn
#     this suite red on the vendor's schedule instead of ours.
#   - Actions: full commit SHA plus the release tag in a comment. Bump both
#     together, by hand: dependency policy for this repository lives in Funky
#     Secure, not in Dependabot. To refresh one:
#       curl -sS https://api.github.com/repos/actions/checkout/releases/latest | grep tag_name
#       curl -sS https://api.github.com/repos/actions/checkout/commits/<tag> | grep -m1 '"sha"'
#   - Node.js: major line only, so every run gets the newest patch of that line
#     (see check-latest below) instead of a frozen point release.
on:
  push:
    branches: [main]
  # `labeled` and `edited` matter: the policy job reads the labels and the body,
  # and both can change after the pull request already exists. `ready_for_review`
  # matters for the same reason: the job is guarded on a draft, so the run that
  # decides is the one that fires when the draft becomes ready.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    # No job name on purpose: GitHub renders it as `test (ubuntu-24.04, 22)`,
    # which is the exact string a future branch protection rule would match.
    strategy:
      # One failing platform must not hide the others: the point of the matrix
      # is to see Windows and Linux results side by side.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # Both supported LTS lines. Node 20 reached end-of-life in April 2026.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Do not settle for the patch already cached in the runner image:
          # fetch the newest release of this line so a security fix published
          # upstream lands here without editing this workflow.
          check-latest: true
      # No dependency install: the package has zero dependencies, so the suite
      # runs against a bare Node toolchain.
      - name: Run the test suite
        run: node --test

  # macOS, as a smoke test and as the only pull-request leg that checks the
  # packed set. Both claims are deliberately small:
  #   - No test in `tests/` creates a case-colliding path or compares a
  #     `realpath` to a `tmpdir`, so this leg does not cover either failure
  #     mode, and it must not be described as if it did. What it adds is a
  #     third operating system running the same assertions, which is how a red
  #     on macOS gets caught before a user reports one.
  #   - `npm run pack:check` today runs only in `prepublishOnly`, which CI
  #     reaches on a `v*` tag: a pull request that breaks the `files` contract
  #     is caught at release time. Here it runs on the pull request, and on a
  #     second platform, so the packed set is compared on darwin as well as
  #     linux. This is not the cheapest home for the check on purpose: the
  #     Ubuntu leg would be, and moving it there is a separate decision.
  # arm64 and one Node line: the package has no native code, so a second
  # architecture or a second Node line would duplicate bytes, not coverage.
  # Never `-latest` (see tests/ci.test.js) and never `-large`, which is a
  # larger runner rather than a standard one.
  test-macos:
    # Named because it is outside the matrix: nothing composes a name for it, so GitHub renders the
    # bare id `test-macos` and the check list says nothing about the platform or the Node line it ran.
    # The id stays `test-macos`: `scripts/wait-for-ci.js` decides on a job's conclusion and only prints
    # its `name`, and `tests/ci.test.js` addresses the job by id. The rendered string is also what a
    # future branch protection rule would match — the claim the `test` job's comment makes about its
    # composed name — so it moves whenever the runner label or the Node line moves. The case deriving
    # it from both is what turns that move into a red test here, instead of a required check that
    # stops matching in silence.
    name: test-macos (macos-26 arm64, node 24)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Run the test suite
        run: node --test
      - name: Check the packed set on this platform
        run: npm run pack:check

  # Contribution policy, enforced rather than hoped for. It only runs on pull
  # requests, and nothing is protected: branch protection is deliberately absent
  # here, so this is feedback, not a gate.
  #
  # A draft is not a candidate yet. `gh pr create --label` attaches the label
  # after the pull request exists, so the `opened` run of a draft reads an empty
  # PR_LABELS and reports a violation nobody caused: one email per pull request,
  # on a job whose only purpose is feedback. Guarding the job removes that red,
  # and `ready_for_review` above fires the run that decides.
  pr-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
      - name: Pull request policy
        run: node scripts/check-pr-policy.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
